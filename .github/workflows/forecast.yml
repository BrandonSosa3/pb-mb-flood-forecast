# Runs the forecast logger twice a day on GitHub's servers and commits the
# snapshot to the repo. The commit timestamp proves each forecast was saved
# BEFORE the event it predicts.
name: Log forecast

on:
  schedule:
    # Times are UTC. 14:00 UTC = 6 am PST, 02:00 UTC = 6 pm PST.
    # (GitHub may start scheduled runs a few minutes late; that's fine.)
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch: {} # adds a "Run workflow" button for manual runs

permissions:
  contents: write # allow this job to commit to this repo (and nothing else)

concurrency:
  group: forecast-log # never run two loggers at once
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save forecast snapshot
        run: python pipeline/forecast_logger.py

      - name: Score past forecasts automatically (rain, water level, City reports, NWS reports, news)
        continue-on-error: true # an outside data source being down must never block saving the snapshot
        run: python pipeline/auto_verify.py

      - name: Build website data from the new snapshot
        id: build
        continue-on-error: true # a website bug must never cost us a forecast snapshot
        run: python pipeline/build_site_data.py

      - name: Check past wave forecasts against what happened
        continue-on-error: true # a CDIP hiccup must never block saving the snapshot
        run: python pipeline/verify_forecasts.py

      - name: Commit snapshot and website data
        run: |
          git config user.name "forecast-logger[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast_log web/public/data docs/evidence/wave_check.md docs/evidence/auto
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Forecast snapshot $(date -u +%Y-%m-%dT%H%MZ)"
          git pull --rebase
          git push

      - name: Flag a failed website build (the snapshot above is already saved)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::build_site_data.py failed; snapshot saved, site not updated"
          exit 1
